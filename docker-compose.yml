# Ambiente di sviluppo locale.
#   docker compose up -d       avvia il sito su http://localhost:9090
#   docker compose down -v     ferma tutto e cancella il database
# Adminer (gestione database) è su http://localhost:9091

services:
  web:
    build: ./docker/php
    # Installa o aggiorna il database a ogni avvio, poi avvia Apache
    command: sh -c "php setup/migrate.php && exec apache2-foreground"
    ports:
      - "9090:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_USER: tombola
      DB_PASSWORD: tombola
      DB_NAME: tombola
      ADMIN_PASSWORD: admin
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: tombola
      MARIADB_USER: tombola
      MARIADB_PASSWORD: tombola
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 10

  adminer:
    image: adminer:4
    ports:
      - "9091:8080"
    depends_on:
      - db

volumes:
  db-data:
